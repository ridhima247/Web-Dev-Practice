<body>
    <h2>This is HTML forms tutorial </h2>
    <form action="backend.php">
        <label for="name">Name</label>
        <div>
            <input type="text" name="myName" id="name">
        </div>
        <br>
        <label for="role">Role</label>
        <div>
            <input type="text" name="myRole" id="role">
        </div>
        <br>
        <label for="email">Email</label>
        <div>
            <input type="text" name="myEmail" id="email">
        </div>
        <br>
        <label for="date"> Date</label>
        <div>
            <input type="date" name="mydata" id="date">
        </div>
        <br>
        <label for="bonus">Bonus</label>
        <div>
            <input type="number" name="myBonus" id="bonus">
        </div>
        <br>
        <label for="eligible"> Are you Eligible?</label>
        <div>
            <input type="checkbox" name="myEligiblity" id="eligible">
        </div>
        <br>
        <div>
            Gender: Male <input type="radio" name="myGender"> FeMale <input type="radio" name="myGender">
            Other <input type="radio" name="myGender">
        </div>
        <br>
        <div>
            Write about yourself: <br><textarea name="myText" cols="90" rows="10"></textarea>
        </div>
        <br>
        <div>
            <label for="car">Car</label>
            <select name="myCar" id="car">
                <option value="ind">Indica</option>
                <option value="swf">Swift</option>
                <option value="lmb" selected>Lemborgini</option>
            </select>
        </div>
        <br>
        <input type="submit" value="submit now">
        <input type="reset" value="reset now">
    </form>

</body>
